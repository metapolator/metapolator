[package]
name = "mp-ui"
version = "0.1.0"
description = "The Metapolator web UI in Rust (Leptos, client side), replacing the AngularJS app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mp-app = { path = "../mp-app" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "Document", "Window", "Element", "KeyboardEvent", "MouseEvent", "Event", "EventTarget", "HtmlElement", "NodeList", "DomRect", "Response"] }
